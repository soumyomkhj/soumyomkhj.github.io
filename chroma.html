    <!-- ==================== LANDING SCREEN ==================== -->
    <div id="chroma-landing" class="chroma-landing dotted-bg">
        <div class="landing-content">
            <h1 class="landing-title">CHROMA<br>CORE</h1>
            <p class="landing-subtitle">Build palette from a single color<br>and test your color game.</p>
            <div class="landing-actions">
                <div class="color-qty-selector">
                    <button class="qty-btn" id="qty-minus" aria-label="Decrease color count">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="3">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <span id="qty-val" class="qty-val">5</span>
                    <button class="qty-btn" id="qty-plus" aria-label="Increase color count">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="3">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <button class="view-btn btn-primary" id="start-btn" style="padding-right: 20px;">
                    Play
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"
                        style="margin-left:8px;vertical-align:middle;">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
            </div>
            <div class="select-colors-desc">
                Select number of colors in the palette to start
            </div>
        </div>
    </div>

    <!-- ==================== GAME SCREEN ==================== -->
    <div id="chroma-app" class="chroma-app" style="display:none;">
        <header class="chroma-header">
            <div class="header-left">
                <button id="game-back-btn" class="back-btn"
                    style="background:none;border:none;color: var(--primary);cursor:pointer;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div class="header-info">
                    <span class="header-title">CHROMA CORE</span>
                    <span id="scheme-name-header" class="header-scheme">Analyzing Palette...</span>
                </div>
            </div>
            <div class="header-right">
                <div class="timer" id="game-timer">
                    <svg viewBox="0 0 40 40">
                        <circle class="timer-bg" cx="20" cy="20" r="18"></circle>
                        <circle class="timer-progress" cx="20" cy="20" r="18"></circle>
                    </svg>
                    <span class="timer-text">90</span>
                </div>
            </div>
        </header>

        <main class="chroma-stage" id="chroma-stage">
            <!-- Dynamically injected by initGame() -->
        </main>

        <footer class="chroma-controls">
            <div class="color-wheel-wrapper">
                <canvas id="color-wheel-canvas" width="120" height="120"></canvas>
                <div class="color-wheel-handle" id="color-wheel-handle"></div>
            </div>
            <div class="sliders-container">
                <div class="slider-group">
                    <div class="slider-header"><label>Hue</label><span class="slider-val" id="hue-val">270&deg;</span>
                    </div>
                    <div class="slider-track hue-track" id="hue-track">
                        <div class="slider-thumb" id="hue-thumb"></div>
                    </div>
                </div>
                <div class="slider-group">
                    <div class="slider-header"><label>Saturation</label><span class="slider-val" id="sat-val">62%</span>
                    </div>
                    <div class="slider-track" id="sat-track">
                        <div class="slider-thumb" id="sat-thumb"></div>
                    </div>
                </div>
                <div class="slider-group">
                    <div class="slider-header"><label>Lightness</label><span class="slider-val" id="lit-val">46%</span>
                    </div>
                    <div class="slider-track lit-track" id="lit-track">
                        <div class="slider-thumb" id="lit-thumb"></div>
                    </div>
                </div>
            </div>
            <div class="action-container">
                <div class="input-group">
                    <label>Hex Input</label>
                    <div class="hex-row">
                        <div class="hex-input-wrapper"><span>#</span><input type="text" id="hex-input" class="hex-input"
                                value="7B2CBF" maxlength="6" placeholder="Enter Hex Color Code"></div>
                        <button id="color-picker-btn" class="color-picker-btn" title="Pick color from screen">
                            <svg width="19" height="19" viewBox="0 0 19 19" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M0 18.125V13.3354L9.02469 4.31067L7.56259 2.89899L9.02469 1.48731L10.9405 3.40316L14.0664 0.277295C14.1504 0.193266 14.2555 0.126043 14.3815 0.0756259C14.5076 0.0252086 14.6378 0 14.7723 0C14.9067 0 15.0327 0.0252086 15.1504 0.0756259C15.268 0.126043 15.3773 0.193266 15.4781 0.277295L17.8477 2.64691C17.9317 2.74774 17.999 2.85698 18.0494 2.97462C18.0998 3.09226 18.125 3.2183 18.125 3.35275C18.125 3.48719 18.0998 3.61744 18.0494 3.74348C17.999 3.86952 17.9317 3.97456 17.8477 4.05859L14.747 7.15925L16.6629 9.12552L15.226 10.5624L13.8143 9.10031L4.78964 18.125H0ZM6.98296 13.1083L12.3522 7.68863L10.4364 5.77277L5.01669 11.142L6.98296 13.1083ZM13.2849 5.77277L15.705 3.35275L14.7723 2.42003L12.3522 4.84006L13.2849 5.77277Z"
                                    fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="view-btn btn-primary in-game" id="evaluate-btn">Evaluate</button>
            </div>
        </footer>

        <!-- Result Modal Overlay -->
        <div id="result-overlay" class="result-overlay dotted-bg hidden">
            <button class="result-back-btn" id="result-back-btn" title="Quit to Home">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="result-modal-container">
                <div class="result-modal">
                    <div class="result-graph">
                        <div class="graph-wrapper">
                            <canvas id="result-wheel-canvas" width="280" height="280"></canvas>
                            <canvas id="result-lines-canvas" width="280" height="280"
                                class="result-lines-overlay"></canvas>
                        </div>
                        <div id="scheme-tag" class="scheme-tag">Triadic Harmony</div>
                    </div>

                    <div class="result-info">
                        <div class="result-header"><span class="result-sub">Result</span>
                            <div class="result-line"></div>
                        </div>
                        <h1 class="result-score"><span id="final-score">94</span><span class="percent">%</span></h1>
                        <p class="result-desc">Accuracy Rating</p>

                        <div class="stats-list">
                            <div class="stat-item">
                                <span class="stat-label">Hue Match</span>
                                <div class="stat-row">
                                    <span class="stat-value" id="stat-hue">98%</span>
                                    <div class="stat-bar-track">
                                        <div class="stat-bar-fill" id="bar-hue" style="width:98%;"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Luminance Balance</span>
                                <div class="stat-row">
                                    <span class="stat-value" id="stat-lum">72%</span>
                                    <div class="stat-bar-track">
                                        <div class="stat-bar-fill" id="bar-lum" style="width:72%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="result-actions">
                            <button class="view-btn btn-primary" id="try-another-btn">Try Another</button>
                            <button class="view-btn btn-secondary" id="retry-btn">Retry</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
        <script src="js/chroma.js"></script>
