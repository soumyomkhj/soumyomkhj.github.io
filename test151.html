<style>
/* Particle background: only needs to be loaded, attaches itself automatically */
body, html {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
}
#particle-bg-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  display: block;
  pointer-events: auto;
  inset: 0;
}
body {
  background: #1a1a1a;
}
</style>
<script>
(function(){
  // Can't rely on DOMContentLoaded if run as injected: poll for <body>
  function ready(fn){if(document.body)fn();else setTimeout(()=>ready(fn),10);}
  ready(function(){
    // Create canvas if not already present 
    let canvas = document.getElementById('particle-bg-canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'particle-bg-canvas';
      document.body.insertBefore(canvas, document.body.firstChild);
    }
    // Use CSS selector, not class, to style; do not add any classes, ids, or attributes to anything else
    // Set style directly as fallback (even if removed by page scripts)
    Object.assign(canvas.style, {
      position: "fixed", left:0, top:0, width:"100vw", height:"100vh", zIndex:0, pointerEvents: "auto", display:"block", inset:"0",
    });

    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const mouse = { x: null, y: null, active: false };

    const particles = [];
    const numParticles = 100;

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.r = 2 + Math.random() * 2;
        this.dx = (Math.random()-0.5) * 1.5;
        this.dy = (Math.random()-0.5) * 1.5;
      }
      update() {
        this.x += this.dx;
        this.y += this.dy;
        // bounce off edges
        if (this.x < 0 || this.x > width) this.dx *= -1;
        if (this.y < 0 || this.y > height) this.dy *= -1;
        // mouse repulsion
        if (mouse.active && mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 120) {
            const angle = Math.atan2(dy, dx);
            const force = (120 - dist) / 120 * 0.5;
            this.dx -= Math.cos(angle) * force;
            this.dy -= Math.sin(angle) * force;
          }
        }
        this.dx *= 0.97;
        this.dy *= 0.97;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2, false);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fill();
      }
    }

    for(let i=0; i<numParticles; i++) particles.push(new Particle());

    // Track mouse and touch on the canvas
    function updatePointer(x, y) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((x - rect.left) / rect.width) * width;
      mouse.y = ((y - rect.top) / rect.height) * height;
      mouse.active = true;
    }
    canvas.addEventListener('mousemove', function(e){
      updatePointer(e.clientX, e.clientY);
    });
    canvas.addEventListener('mouseleave', function(){
      mouse.x = null; mouse.y = null; mouse.active = false;
    });
    canvas.addEventListener('mouseenter', function(){ mouse.active = true; });
    canvas.addEventListener('touchmove', function(e){
      if (e.touches && e.touches.length) {
        updatePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    });
    canvas.addEventListener('touchend', function(){
      mouse.x = null; mouse.y = null; mouse.active = false;
    });

    function connectParticles() {
      for (let i=0;i<particles.length;i++) {
        for (let j=i+1;j<particles.length;j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 100) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(255,255,255,${1-dist/100})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
    }
    function animate(){
      ctx.clearRect(0,0,width,height);
      connectParticles();
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  });
})();
</script>
